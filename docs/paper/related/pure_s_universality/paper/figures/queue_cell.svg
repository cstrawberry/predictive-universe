<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">One native-S queue-cell contraction</title><desc id="desc">The live cell ((S S) v_i) X contracts to (S X)(v_i X). The left X is the active predecessor; the separate right X is retained history.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L9 4Z" fill="#273f54"/></marker><style>text{font-family:'DejaVu Sans',sans-serif;text-anchor:middle;fill:#172f40}.eq{font-size:43px}.label{font-size:31px}.node{font-size:38px}.edge{stroke:#273f54;stroke-width:3;fill:none}.active{fill:#e3f1f8;stroke:#174969;stroke-width:4}.history{fill:#f4f4f4;stroke:#626e78;stroke-width:3;stroke-dasharray:8 5}</style></defs><rect width="1200" height="570" fill="white"/>
<text class="eq" x="265" y="95">((S S) vᵢ) X</text><text class="label" x="265" y="147">live cell Lᵢ(X)</text><path class="edge" d="M475 83H670" marker-end="url(#arrow)"/><text class="label" x="572" y="139">one step</text><text class="eq" x="920" y="95">(S X)(vᵢ X)</text><text class="label" x="920" y="147">consumed-cell residual</text>
