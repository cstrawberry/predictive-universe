<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc"><title id="title">Proof of the root-restarted computation theorem</title><desc id="desc">Exact cyclic-tag checkpoints, finite root recovery, compiler correctness, literal source readback, and measured interfaces combine in Theorem 1R. The confluence and certificate results are independent.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0 0 L0 7 L8 3.5Z" fill="#273f54"/></marker><style>.box{fill:white;stroke:#273f54;stroke-width:3}.main{fill:#edf4fa;stroke:#174969;stroke-width:4}.h{font:700 34px 'DejaVu Sans',sans-serif;text-anchor:middle;fill:#172f40}.t{font:30px 'DejaVu Sans',sans-serif;text-anchor:middle;fill:#273f54}.edge{fill:none;stroke:#273f54;stroke-width:3;marker-end:url(#arrow)}</style></defs><rect width="1400" height="920" fill="white"/>
